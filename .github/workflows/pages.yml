name: Publish TopRepet branch preview

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the public design branch
        run: git clone --depth 1 --branch codex/liquid-glass https://github.com/al7xey/toprepet.git source
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Build the preview for its GitHub Pages subpath
        working-directory: source
        env:
          VITE_API_MODE: demo
          VITE_BASE_PATH: /toprepet-preview/
        run: pnpm install --frozen-lockfile && pnpm run build:e2e && pnpm exec tsc --noEmit
      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
